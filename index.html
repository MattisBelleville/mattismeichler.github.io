<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mattis Meichler — Journalist</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f4f0;
    --accent: #e8ff3c;
    --gray: #888;
    --border: #222;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    padding: 48px 60px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 40px;
    animation: fadeUp 0.8s ease both;
  }

  .name-block h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 8vw, 100px);
    line-height: 0.9;
    letter-spacing: 2px;
    color: var(--white);
  }

  .name-block h1 span {
    color: var(--accent);
  }

  .header-meta {
    text-align: right;
    max-width: 300px;
  }

  .header-meta p {
    font-size: 14px;
    color: var(--gray);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .header-meta a {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 1px;
    transition: opacity 0.2s;
  }
  .header-meta a:hover { opacity: 0.6; }

  /* TICKER */
  .ticker {
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    padding: 10px 0;
    background: var(--accent);
  }

  .ticker-inner {
    display: flex;
    gap: 80px;
    animation: ticker 20s linear infinite;
    white-space: nowrap;
  }

  .ticker-inner span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--black);
    flex-shrink: 0;
  }

  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* MAIN LAYOUT */
  main {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    min-height: calc(100vh - 200px);
  }

  /* SECTION */
  section {
    border-right: 1px solid var(--border);
    padding: 48px 40px;
    animation: fadeUp 0.8s ease both;
  }
  section:last-child { border-right: none; }
  section:nth-child(1) { animation-delay: 0.1s; }
  section:nth-child(2) { animation-delay: 0.2s; }
  section:nth-child(3) { animation-delay: 0.3s; }

  .section-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gray);
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .outlet-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
    color: var(--white);
    margin-bottom: 24px;
  }

  .articles {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .article-link {
    display: block;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--white);
    font-size: 14px;
    line-height: 1.45;
    font-weight: 400;
    transition: all 0.25s ease;
    position: relative;
    padding-left: 0;
  }

  .article-link::before {
    content: '→';
    position: absolute;
    left: -20px;
    opacity: 0;
    color: var(--accent);
    transition: all 0.25s ease;
    font-size: 12px;
  }

  .article-link:hover {
    color: var(--accent);
    padding-left: 20px;
  }

  .article-link:hover::before {
    opacity: 1;
    left: 0;
  }

  .article-link:first-child {
    border-top: 1px solid var(--border);
  }

  /* VIDEO SECTION */
  .video-block {
    margin-top: 40px;
    padding-top: 40px;
    border-top: 1px solid var(--border);
  }

  .video-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gray);
    margin-bottom: 16px;
  }

  .video-item {
    display: block;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
    text-decoration: none;
    color: var(--white);
    font-size: 14px;
    line-height: 1.45;
